name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # The release workflow runs this whole pipeline before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CTEST_PARALLEL_LEVEL: 4

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported compilers.
          - name: Ubuntu / GCC 12
            os: ubuntu-24.04
            apt: g++-12
            cxx: g++-12
            shared: OFF
          - name: Ubuntu / Clang 16
            os: ubuntu-24.04
            apt: clang-16
            cxx: clang++-16
            shared: OFF
          # Newest compilers on the runner image.
          - name: Ubuntu / GCC 14
            os: ubuntu-24.04
            apt: g++-14
            cxx: g++-14
            shared: OFF
          - name: Ubuntu / Clang 18 / shared
            os: ubuntu-24.04
            apt: clang-18
            cxx: clang++-18
            shared: ON
          # Visual Studio generator (multi-config).
          - name: Windows / MSVC 2022
            os: windows-2022
            shared: OFF
          - name: Windows / MSVC 2022 / shared
            os: windows-2022
            shared: ON
          # Unix Makefiles generator: Ninja is recommended, not required.
          - name: macOS / AppleClang
            os: macos-15
            shared: OFF
    steps:
      - uses: actions/checkout@v7

      - name: Install compiler and Ninja
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ${{ matrix.apt }}
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

      - name: Configure
        run: >-
          cmake --preset release-tests
          -DPROJECTILE_WARNINGS_AS_ERRORS=ON
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}

      - name: Build
        run: cmake --build --preset release-tests

      - name: Test
        run: ctest --preset release-tests

  # Verifies the documented minimum CMake version, and that plain CMake works without presets.
  cmake-minimum:
    name: Ubuntu / GCC 12 / CMake 3.20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install CMake 3.20 and GCC 12
        run: |
          python -m pip install cmake==3.20.5
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-12
          cmake --version | grep -F 'cmake version 3.20.5'

      - name: Configure
        env:
          CXX: g++-12
        run: >-
          cmake -S . -B build -G "Unix Makefiles"
          -DCMAKE_BUILD_TYPE=Release
          -DPROJECTILE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install clang-format
        run: |
          python -m pip install clang-format==22.1.8
          clang-format --version

      - name: Check formatting
        run: git ls-files -z -- '*.hpp' '*.cpp' | xargs -0 -r clang-format --dry-run --Werror

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install clang-tidy, Clang and Ninja
        run: |
          python -m pip install clang-tidy==22.1.8
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang-18
          clang-tidy --version

      - name: Configure
        env:
          CXX: clang++-18
          CMAKE_GENERATOR: Ninja
        run: >-
          cmake --preset dev
          -DPROJECTILE_ENABLE_CLANG_TIDY=ON
          -DPROJECTILE_CLANG_TIDY_EXECUTABLE="$(command -v clang-tidy)"

      - name: Build (runs clang-tidy on every Projectile source)
        run: cmake --build --preset dev
