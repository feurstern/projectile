name: Sanitizers

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanitizers-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CTEST_PARALLEL_LEVEL: 4
  CMAKE_GENERATOR: Ninja
  # LeakSanitizer runs as part of AddressSanitizer on Linux (detect_leaks=1).
  ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:check_initialization_order=1:strict_init_order=1:strict_string_checks=1
  UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

jobs:
  sanitize:
    name: ASan + UBSan / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 14
            apt: g++-14
            cxx: g++-14
          - name: Clang 18
            apt: clang-18
            cxx: clang++-18
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7

      - name: Install compiler and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ${{ matrix.apt }}

      # Recent runner kernels use more ASLR entropy than older sanitizer runtimes can map their
      # shadow memory around; reduce it to the long-standing default.
      - name: Adjust ASLR for sanitizers
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake --preset sanitize

      - name: Build
        run: cmake --build --preset sanitize

      - name: Test
        run: ctest --preset sanitize
